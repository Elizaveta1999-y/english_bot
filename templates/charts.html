{% extends "base.html" %}

{% block content %}
<h2>📊 Графики</h2>
<p class="text-muted">Данные за последние 30 дней</p>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h5>Новые пользователи</h5>
                <canvas id="newUsersChart" style="max-height: 300px;"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h5>Активность пользователей</h5>
                <canvas id="activityChart" style="max-height: 300px;"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h5>Финансы (доходы/расходы/прибыль)</h5>
                <canvas id="financeChart" style="max-height: 300px;"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h5>Активные подписки</h5>
                <canvas id="subscriptionChart" style="max-height: 300px;"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h5>Голосовые минуты</h5>
                <canvas id="voiceChart" style="max-height: 300px;"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    async function loadCharts() {
        // Общие данные
        const resAll = await fetch('/api/charts-data?days=30&type=all');
        const allData = await resAll.json();
        const labels = allData.new_users.map(d => d.date);
        const newUsersCounts = allData.new_users.map(d => d.count);
        const activityCounts = allData.activity.map(d => d.count);

        new Chart(document.getElementById('newUsersChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{ label: 'Новых пользователей', data: newUsersCounts, borderColor: 'rgba(54, 162, 235, 1)', backgroundColor: 'rgba(54, 162, 235, 0.2)', fill: true, tension: 0.1 }]
            },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });

        new Chart(document.getElementById('activityChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{ label: 'Действий', data: activityCounts, borderColor: 'rgba(255, 99, 132, 1)', backgroundColor: 'rgba(255, 99, 132, 0.2)', fill: true, tension: 0.1 }]
            },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });

        // Финансы
        const resFinance = await fetch('/api/charts-data?days=30&type=finance');
        const financeData = await resFinance.json();
        const financeLabels = financeData.map(d => d.date);
        const income = financeData.map(d => d.income);
        const expenses = financeData.map(d => d.expenses);
        const profit = financeData.map(d => d.profit);

        new Chart(document.getElementById('financeChart'), {
            type: 'line',
            data: {
                labels: financeLabels,
                datasets: [
                    { label: 'Доходы', data: income, borderColor: 'rgba(40, 167, 69, 1)', backgroundColor: 'rgba(40, 167, 69, 0.1)', fill: true, tension: 0.1 },
                    { label: 'Расходы', data: expenses, borderColor: 'rgba(220, 53, 69, 1)', backgroundColor: 'rgba(220, 53, 69, 0.1)', fill: true, tension: 0.1 },
                    { label: 'Прибыль', data: profit, borderColor: 'rgba(255, 193, 7, 1)', backgroundColor: 'rgba(255, 193, 7, 0.1)', fill: true, tension: 0.1 }
                ]
            },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } }
        });

        // Подписки
        const resSub = await fetch('/api/charts-data?days=30&type=subscriptions');
        const subData = await resSub.json();
        const subLabels = subData.map(d => d.date);
        const subCounts = subData.map(d => d.active_subscriptions);

        new Chart(document.getElementById('subscriptionChart'), {
            type: 'line',
            data: {
                labels: subLabels,
                datasets: [{ label: 'Активных подписок', data: subCounts, borderColor: 'rgba(23, 162, 184, 1)', backgroundColor: 'rgba(23, 162, 184, 0.2)', fill: true, tension: 0.1 }]
            },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });

        // Голосовые минуты
        const resVoice = await fetch('/api/charts-data?days=30&type=voice');
        const voiceData = await resVoice.json();
        const voiceLabels = voiceData.map(d => d.date);
        const voiceMinutes = voiceData.map(d => d.voice_minutes);

        new Chart(document.getElementById('voiceChart'), {
            type: 'line',
            data: {
                labels: voiceLabels,
                datasets: [{ label: 'Голосовых минут', data: voiceMinutes, borderColor: 'rgba(153, 102, 255, 1)', backgroundColor: 'rgba(153, 102, 255, 0.2)', fill: true, tension: 0.1 }]
            },
            options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
    }

    document.addEventListener('DOMContentLoaded', loadCharts);
</script>

<div class="mt-3">
    <a href="/" class="btn btn-secondary">На главную</a>
</div>
{% endblock %}
